name: CI

on:
  push:
    branches: [main, web-demo]
  pull_request:

jobs:
  web:
    name: Browser demo (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python + MuJoCo (pytest)
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Headless EGL for MuJoCo rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
